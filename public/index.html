<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hotspot Messenger</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="page-backdrop" aria-hidden="true"></div>
    <div class="app">
      <header class="app-header">
        <div class="header-top">
          <div class="brand">
            <span class="brand-icon" aria-hidden="true">📡</span>
            <div>
              <h1>Hotspot Messenger</h1>
              <p class="tagline">Local chat · no mobile data</p>
            </div>
          </div>
          <div class="header-actions">
            <button
              type="button"
              id="theme-toggle"
              class="icon-btn"
              aria-expanded="false"
              aria-controls="theme-panel"
              title="Appearance settings"
            >
              🎨
            </button>
            <span class="live-badge" title="Realtime on your network">Live</span>
          </div>
        </div>

        <section id="theme-panel" class="theme-panel" hidden>
          <h2 class="theme-panel-title">Appearance</h2>

          <div class="theme-group">
            <span class="theme-label">Mode</span>
            <div class="theme-options" role="group" aria-label="Light or dark mode">
              <button type="button" class="theme-option" data-setting="mode" data-value="light">☀️ Light</button>
              <button type="button" class="theme-option" data-setting="mode" data-value="dark">🌙 Dark</button>
            </div>
          </div>

          <div class="theme-group">
            <span class="theme-label">Color theme</span>
            <div class="theme-swatches" role="group" aria-label="Color theme">
              <button type="button" class="swatch swatch-teal" data-setting="theme" data-value="teal" title="Teal"></button>
              <button type="button" class="swatch swatch-violet" data-setting="theme" data-value="violet" title="Violet"></button>
              <button type="button" class="swatch swatch-rose" data-setting="theme" data-value="rose" title="Rose"></button>
              <button type="button" class="swatch swatch-amber" data-setting="theme" data-value="amber" title="Amber"></button>
              <button type="button" class="swatch swatch-ocean" data-setting="theme" data-value="ocean" title="Ocean"></button>
            </div>
          </div>

          <div class="theme-group">
            <span class="theme-label">Wallpaper</span>
            <div class="theme-options theme-options-wrap" role="group" aria-label="Wallpaper">
              <button type="button" class="theme-option" data-setting="wallpaper" data-value="none">Plain</button>
              <button type="button" class="theme-option" data-setting="wallpaper" data-value="dots">Dots</button>
              <button type="button" class="theme-option" data-setting="wallpaper" data-value="grid">Grid</button>
              <button type="button" class="theme-option" data-setting="wallpaper" data-value="waves">Waves</button>
              <button type="button" class="theme-option" data-setting="wallpaper" data-value="aurora">Aurora</button>
              <button type="button" class="theme-option" data-setting="wallpaper" data-value="mesh">Mesh</button>
            </div>
          </div>
        </section>

        <div class="join-url-card" id="join-url-card">
          <span class="join-url-label">Share with friends</span>
          <p class="join-url" id="join-url">Loading join link…</p>
        </div>
      </header>

      <section class="name-section" aria-label="Your display name">
        <label for="display-name">Display name</label>
        <div class="name-row">
          <input
            id="display-name"
            type="text"
            maxlength="24"
            placeholder="e.g. Jai"
            autocomplete="nickname"
          />
          <button type="button" id="join-button">Join</button>
        </div>
        <p class="join-hint" id="join-hint">Enter a name and tap Join to start chatting.</p>
      </section>

      <section class="online-section" aria-label="Online users">
        <div class="online-header">
          <h2 class="online-title">Online</h2>
          <span class="online-count" id="online-count">0</span>
        </div>
        <div class="online-list" id="online-list">
          <span class="online-empty">Nobody online yet</span>
        </div>
      </section>

      <section class="messages" id="messages" aria-live="polite" aria-label="Messages">
        <div class="empty-state">
          <span class="empty-icon" aria-hidden="true">💬</span>
          <p>No messages yet</p>
          <span class="empty-sub">Join the chat and say hello!</span>
        </div>
      </section>

      <form class="composer" id="chat-form" autocomplete="off">
        <label class="sr-only" for="message-input">Message</label>
        <input
          id="message-input"
          type="text"
          placeholder="Join with a name to chat..."
          maxlength="500"
          disabled
        />
        <button type="submit" id="send-button" disabled aria-label="Send message">
          <span class="send-label">Send</span>
          <span class="send-icon" aria-hidden="true">➤</span>
        </button>
      </form>
    </div>
    <script src="/socket.io/socket.io.js"></script>
    <script src="themes.js"></script>
    <script src="app.js"></script>
  </body>
</html>
