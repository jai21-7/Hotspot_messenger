<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hotspot Messenger</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="app">
      <header class="app-header">
        <h1>Hotspot Messenger</h1>
        <p class="tagline">Chat on the same Wi‑Fi — no mobile data needed</p>
        <p class="join-url" id="join-url">Loading join link…</p>
      </header>

      <section class="name-section" aria-label="Your display name">
        <label for="display-name">Your name</label>
        <div class="name-row">
          <input
            id="display-name"
            type="text"
            maxlength="24"
            placeholder="Enter your name"
            autocomplete="nickname"
          />
          <button type="button" id="join-button">Join</button>
        </div>
        <p class="join-hint" id="join-hint">Enter a name and tap Join to chat.</p>
      </section>

      <section class="online-section" aria-label="Online users">
        <h2 class="online-title">Online</h2>
        <p class="online-list" id="online-list">Nobody online yet</p>
      </section>

      <section class="messages" id="messages" aria-live="polite" aria-label="Messages">
        <p class="empty-state">No messages yet. Join and say hello!</p>
      </section>

      <form class="composer" id="chat-form" autocomplete="off">
        <label class="sr-only" for="message-input">Message</label>
        <input
          id="message-input"
          type="text"
          placeholder="Join with a name to chat..."
          maxlength="500"
          disabled
        />
        <button type="submit" id="send-button" disabled>Send</button>
      </form>
    </div>
    <!-- Socket.io client library (served automatically by the server) -->
    <script src="/socket.io/socket.io.js"></script>
    <script src="app.js"></script>
  </body>
</html>
